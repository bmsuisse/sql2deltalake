[project]
name = "odbc2deltalake"
version = "0.14.3"
description = ""
authors = [{ name = "Adrian Ehrsam", email = "adrian.ehrsam@bmsuisse.ch" }]
dependencies = [
    "pydantic >=1.10.0",
    "azure-identity >=1.15.0,<2",
    "sqlglot >=23.17.0",
]
requires-python = ">=3.10"

[project.scripts]

[project.optional-dependencies]
local = [
    "arrowsql >=0.1.0",
    "deltalake2db[deltalake] >=0.9.3",
    "duckdb",
    "pyarrow >=16.1",
    "deltalake >=0.17.1",
]
local_azure = [
    "azure-identity",
    "arrowsql >=0.1.0",
    "deltalake2db[deltalake] >=0.9.3",
    "azure-storage-file-datalake",
    "pyarrow >=16.1",
    "deltalake >=0.17.1",
    "adlfs >=2024.2.0,<2025",
]
postgres = ["adbc-driver-postgresql>=1.7.0"]
mssql = ["arrowsql >=0.1.0"]
arrowsql = [
    "arrowsql >=0.1.0",
    "deltalake2db[deltalake] >=0.9.3",
    "duckdb",
    "pyarrow >=16.1",
    "deltalake >=0.17.1",
]
# sql2deltalake.spark; pyspark >= 4.0 comes with the Spark runtime
spark-source = ["arrowsql >=0.1.0", "pyarrow >=16.1"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
# The Rust core (crates/) is the extension module odbc2deltalake._core; the Python package is
# the directory odbc2deltalake/ next to this file. abi3: one wheel for Python 3.10+.
manifest-path = "crates/sql2deltalake-py/Cargo.toml"
module-name = "odbc2deltalake._core"
python-packages = ["odbc2deltalake", "sql2deltalake"]
features = ["pyo3/extension-module"]

[tool.pyright]
venv = ".venv"
venvPath = "."
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc.)?abstractmethod",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.uv]
native-tls = true
keyring-provider = "subprocess"

[[tool.uv.index]]
name = "BMSAzureDevOps"
url = "https://VssSessionToken@pkgs.dev.azure.com/bmeurope/_packaging/BMS/pypi/simple/"
explicit = true
publish-url = "https://pkgs.dev.azure.com/bmeurope/_packaging/BMS/pypi/upload/"

[dependency-groups]
dev = ["pyright >=1.1.352,<2", "ruff >=0.4.3", "maturin >=1.9,<2"]
test = [
    "pytest >=8.0.2,<9",
    "pytest-asyncio >=0.23.5",
    "pytest-order >=1.2.0,<2",
    "pytest-cov >=4.1.0,<5",
    "docker >=7.0.0,<8",
    "python-dotenv >=1.0.1,<2",
    "azure-storage-blob >=12.19.1,<13",
    "pandas >=1.4.2",
    "delta-spark >=3.2.0,<4",
    "pyarrow >=16.1",
    "duckdb",
    "deltalake2db >=0.10.2",
    "fsspec",
]
spark = ["delta-spark >=3.2.0,<4", "pyspark >=3.5.1,<4"]
