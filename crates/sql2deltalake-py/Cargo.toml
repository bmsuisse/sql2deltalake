[package]
name = "sql2deltalake-py"
description = "Python bindings of sql2deltalake-core (odbc2deltalake._core)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = ["kernel", "arrowsql-core"]
# Reads of local Delta tables with delta-kernel-rs instead of a Python callback.
kernel = ["dep:delta_kernel", "dep:delta_kernel_default_engine", "dep:url"]
# Source reads through arrowsql's Rust core (TDS to Arrow) instead of its Python package.
arrowsql-core = ["dep:arrowsql-core"]

[dependencies]
sql2deltalake-core = { path = "../sql2deltalake-core" }
arrow-array.workspace = true
arrow-schema.workspace = true
pyo3.workspace = true
delta_kernel = { version = "0.30.1", features = ["arrow-60", "default-engine-base"], optional = true }
delta_kernel_default_engine = { version = "0.30.1", default-features = false, features = ["arrow-60"], optional = true }
url = { version = "2", optional = true }
# Pinned: the core's API carries no stability promise yet (main with arrowsql-core and the DNS cache).
arrowsql-core = { git = "https://github.com/bmsuisse/arrowsql", rev = "cb18dae48d6fe95af3cd80f951554885981361ee", optional = true }
